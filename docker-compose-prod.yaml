services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: x
      POSTGRES_DB: chaldb
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  app:
    image: registry-chall.tccpens.id/challenge/webex/waguri:latest
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:x@db:5432/chaldb
      POSTGRES_PASSWORD: x
      JWT_SECRET: x
      JWT_EXPIRES_IN: 3600
    ports:
      - "3000:3000"
    depends_on:
      - db
